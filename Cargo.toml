[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/transport",
    "crates/node",
    "crates/mobile",
]

# Shared dependency versions. Pin everything — reproducible builds are a
# security property here, not a nicety (see docs/ARCHITECTURE.md §6).
[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
futures = "0.3"
base64 = "0.22"
rpassword = "7"
tempfile = "3"

# --- Terminal UI and invite QR codes ---
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
qrcode = { version = "0.14", default-features = false }

# --- Voice calls: Opus (bundled libopus, built with cmake) for the speech,
# and on computers the microphone/speaker and an echo canceller (the phone
# app uses the system's own) ---
opus-codec = "=0.2.0"
cpal = "=0.18.2"
sonora = "=0.2.0"

# --- Swift bindings for the iPhone app (crates/mobile) ---
uniffi = "0.32"

# --- macOS keychain (already in the tree via Nym's TLS stack) ---
security-framework = "2.11"

# --- Windows: private folders and a clipboard that skips history/cloud sync
# (0.59 is already in the tree via tokio and friends) ---
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }

# --- At-rest encryption of the local profile ---
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
# Mixes the device key into the profile key (already in the tree via OpenMLS).
hkdf = "0.12"
# Locking key memory and turning off crash dumps (already in the tree).
libc = "0.2"
# Message IDs (already in the tree via OpenMLS).
sha2 = "0.10"

# --- Content-encryption layer (crates.io, stable) ---
openmls = "0.6"
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
# Only to refuse low-order keys hpke-rs 0.2 doesn't check (RUSTSEC-2026-0072);
# the version OpenMLS already uses.
x25519-dalek = "2"

# --- Transport layer (Nym) ---
# Published on crates.io again; pinned exactly for reproducible builds.
# CAUTION: nym-sdk's own requirements ("^1.21.6") let `cargo update` pull in
# 1.22.x Nym sub-crates that do not compile against each other. Cargo.lock
# pins the whole Nym tree to the matching 1.21.6 set — do not run a blanket
# `cargo update`; update Nym only by moving every nym-* crate together.
nym-sdk = "=1.21.6"
# Used directly only to point Nym at Tor (see crates/transport/src/tor.rs).
nym-gateway-client = "=1.21.6"
nym-http-api-client = "=1.21.6"
# The ack key's byte form (the Nym clients' secrets live in the encrypted
# profile, see crates/transport/src/nym.rs); also checks padding against
# Nym's own packet splitting in tests.
nym-sphinx = "=1.21.6"
# The gateway registration types, to keep them in the profile too.
nym-client-core-gateways-storage = "=1.21.6"
rand08 = { package = "rand", version = "=0.8.8" }
# For Nym's TopologyProvider trait (already in the tree via Nym).
async-trait = "0.1"
# Same version Nym's HTTP client uses; we only add SOCKS support to it.
reqwest = { version = "=0.13.5", default-features = false, features = ["socks"] }

[patch.crates-io]
# Nym's gateway client with one addition: connect through Tor's SOCKS port.
# See vendor/README.md.
nym-gateway-client = { path = "vendor/nym-gateway-client" }
# Nym's SQLite helper reads its own open files through proc_pidinfo, which
# doesn't build for iOS as published. See vendor/README.md.
proc_pidinfo = { path = "vendor/proc_pidinfo" }
# Leaves out sysinfo, which doesn't build for iOS, there. See vendor/README.md.
nym-statistics-common = { path = "vendor/nym-statistics-common" }

# OpenMLS 0.6 has `debug_assert!(false)` on AEAD failure, so in debug builds a
# single corrupted or forged packet from the network would panic the node.
# Release builds return an error there; make debug builds behave the same.
# Build-time helpers (proc macros, build scripts) are not stripped: on
# macOS 27 the system `strip` corrupts proc-macro libraries (rustc then
# fails with "mis-aligned LINKEDIT string pool"). Doesn't touch what ships.
[profile.release.build-override]
strip = false

# Test builds without full debugging data: with the Nym tree it ran to
# tens of GB. Our own code keeps line numbers (enough for backtraces);
# dependencies get none.
# (Not stripped either: see the note above on macOS 27's strip.)
[profile.dev]
debug = "line-tables-only"
strip = false
[profile.dev.package."*"]
debug = false
strip = false
[profile.dev.build-override]
strip = false

[profile.dev.package.openmls]
debug-assertions = false

# The call's audio work (Opus, the echo canceller) has to keep up with real
# time, even in a test build.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.opus-codec]
opt-level = 3

# Argon2 is deliberately expensive; unoptimised it makes every debug-build
# unlock (and the test suite) take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
