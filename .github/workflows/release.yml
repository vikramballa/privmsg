name: Release

# Push a tag like v0.2.0 to build binaries and publish them as a GitHub
# release (marked as a pre-release: privmsg has not been audited).
on:
  push:
    tags: ["v*"]

# Least privilege: only the publish job may write to the repository.
# Actions are pinned to commit SHAs (tags can be moved to other code).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # tor: which Tor Expert Bundle goes in the download. The Tor
          # Project publishes none for Linux on ARM; there privmsg uses the
          # system's Tor (`sudo apt install tor`).
          - target: aarch64-apple-darwin
            os: macos-latest
            tor: macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            tor: macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            tor: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            tor: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            tor: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signed build provenance: `gh attestation verify <file> -R vikramballa/privmsg`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add ${{ matrix.target }}
      # No build cache here: release binaries are built from scratch, so a
      # cache written by another run can't end up in them.
      - run: cargo test --workspace --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }} -p privmsg-node
      - name: Package
        shell: bash
        run: |
          name="privmsg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ -n "${{ matrix.tor }}" ]; then
            scripts/fetch-tor.sh "$name" "${{ matrix.tor }}"
            # Smoke test: the bundled Tor runs here (the Intel Mac build is
            # made on an Apple-silicon runner, so it can't be run there).
            if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
              LD_LIBRARY_PATH="$name/tor" "$name/tor/tor" --version
            fi
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/privmsg.exe" "$name/"
            7z a "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/privmsg" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            privmsg-*.tar.gz
            privmsg-*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            privmsg-*.tar.gz*
            privmsg-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            privmsg-*.tar.gz*
            privmsg-*.zip*
