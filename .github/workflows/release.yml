name: Release

# Push a tag like v0.2.0 to build binaries and publish them as a GitHub
# release (marked as a pre-release: privmsg has not been audited).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # tor: which Tor Expert Bundle goes in the download. The Tor
          # Project publishes none for Linux on ARM; there privmsg uses the
          # system's Tor (`sudo apt install tor`).
          - target: aarch64-apple-darwin
            os: macos-latest
            tor: macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            tor: macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            tor: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            tor: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            tor: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --workspace --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }} -p privmsg-node
      - name: Package
        shell: bash
        run: |
          name="privmsg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ -n "${{ matrix.tor }}" ]; then
            scripts/fetch-tor.sh "$name" "${{ matrix.tor }}"
            # Smoke test: the bundled Tor runs here (the Intel Mac build is
            # made on an Apple-silicon runner, so it can't be run there).
            if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
              LD_LIBRARY_PATH="$name/tor" "$name/tor/tor" --version
            fi
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/privmsg.exe" "$name/"
            7z a "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/privmsg" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            privmsg-*.tar.gz*
            privmsg-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            privmsg-*.tar.gz*
            privmsg-*.zip*
