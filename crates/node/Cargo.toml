[package]
name = "privmsg-node"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "The privmsg messenger: MLS-encrypted conversations over the Nym mixnet."

[[bin]]
name = "privmsg"
path = "src/main.rs"
required-features = ["nym", "audio"]

[features]
default = ["nym", "audio"]
nym = ["privmsg-transport/nym"]
# The computer's microphone and speaker, and an echo canceller, for calls
# in the desktop app. The phone app brings its own.
audio = ["dep:cpal", "dep:sonora"]

[dependencies]
privmsg-crypto = { path = "../crypto" }
privmsg-transport = { path = "../transport", default-features = false }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
base64 = { workspace = true }
rpassword = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
qrcode = { workspace = true }
opus-codec = { workspace = true }
cpal = { workspace = true, optional = true }
sonora = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Paused time, for the call's playout timing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
