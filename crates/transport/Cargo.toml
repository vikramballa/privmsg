[package]
name = "privmsg-transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Layer 2: metadata-private transport over the Nym mixnet (Sphinx + cover traffic)."

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
nym-sdk = { workspace = true, optional = true }

[features]
# The real mixnet. Off only for the fuzz targets, which use the in-memory
# network and don't need to build (or link) the Nym tree.
default = ["nym"]
nym = ["dep:nym-sdk"]
